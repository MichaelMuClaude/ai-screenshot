[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-screenshot"
version = "0.1.0"
description = "A minimal full-screen screenshot CLI for AI agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
ai-screenshot = "ai_screenshot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_screenshot"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real: tests that require a real X11 session and ImageMagick",
]
